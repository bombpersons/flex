name = "Reaction-Diffusion Skin"
description = "Living zebra and coral patterns grow over everything and creep along the shapes in the picture."
feedback = true
audio = true

[[settings]]
key = "size"
label = "Pattern size"
type = "number"
min = 2
max = 12
step = 1
unit = ""
default = 5

[[settings]]
key = "follow"
label = "Follow the film"
type = "number"
detail = "How much the picture steers the pattern"
min = 0
max = 100
step = 10
unit = "%"
default = 50

[[settings]]
key = "strength"
label = "Strength"
type = "number"
min = 10
max = 100
step = 10
unit = "%"
default = 70

[[settings]]
key = "colours"
label = "Colours"
type = "choice"
default = "film"
options = [
    { id = "film", label = "From the film" },
    { id = "coral", label = "Coral" },
    { id = "zebra", label = "Zebra" },
]
